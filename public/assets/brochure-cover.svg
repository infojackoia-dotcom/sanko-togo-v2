<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" fill="none" aria-label="Couverture Brochure SANKO TOGO">
  <defs>
    <!-- Shadow for book elevation -->
    <filter id="bookShadow" x="-15%" y="-10%" width="135%" height="130%">
      <feDropShadow dx="12" dy="16" stdDeviation="16" flood-color="#0F2444" flood-opacity="0.25" />
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#0F2444" flood-opacity="0.15" />
    </filter>

    <!-- Deep Navy Cover Gradient -->
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4E" />
      <stop offset="50%" stop-color="#1A3A6A" />
      <stop offset="100%" stop-color="#0E1D33" />
    </linearGradient>

    <!-- Gloss highlight spine -->
    <linearGradient id="spineGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Gold badge gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Book Container with 3D shadow -->
  <g filter="url(#bookShadow)">
    <!-- Book Base / Cover -->
    <rect x="25" y="20" width="350" height="495" rx="14" fill="url(#coverBg)" />

    <!-- Subtle Geometric Background Accent Lines -->
    <path d="M 25 180 L 375 290 L 375 515 L 25 515 Z" fill="#FFFFFF" fill-opacity="0.03" />
    <circle cx="340" cy="80" r="120" fill="#FFFFFF" fill-opacity="0.02" />

    <!-- Top Badge -->
    <rect x="55" y="55" width="150" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
    <text x="130" y="72" text-anchor="middle" font-family="'Glacial Indifference', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">ÉDITION OFFICIELLE</text>

    <!-- Logo SANKO Section -->
    <g transform="translate(55, 110)">
      <!-- Mini logo mark -->
      <polygon points="12,28 7,22 15,9 19,15 15,22" fill="#38BDF8" />
      <polygon points="31,22 27,28 12,28 15,22 23,22" fill="#1A3A6A" />
      <polygon points="15,9 23,9 31,22 23,22 19,15" fill="#60A5FA" />
      
      <!-- Logo Typography -->
      <text x="38" y="22" font-family="'League Spartan', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="3">SANKO</text>
      <text x="126" y="22" font-family="'League Spartan', sans-serif" font-size="14" font-weight="700" fill="#38BDF8" letter-spacing="2">TOGO</text>
    </g>

    <!-- Divider Line -->
    <line x1="55" y1="160" x2="345" y2="160" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- Main Title -->
    <text x="55" y="210" font-family="'League Spartan', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">BROCHURE</text>
    <text x="55" y="244" font-family="'League Spartan', sans-serif" font-size="24" font-weight="800" fill="#38BDF8" letter-spacing="-0.5">INSTITUTIONNELLE</text>

    <!-- Subtitle / Focus Areas -->
    <g transform="translate(55, 280)">
      <text x="0" y="0" font-family="'Glacial Indifference', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">MOBILITÉ PROFESSIONNELLE</text>
      <text x="0" y="20" font-family="'Glacial Indifference', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">&amp; GESTION DE PARC AUTOMOBILE</text>
    </g>

    <!-- Bullet Highlights Card Inside Cover -->
    <rect x="55" y="325" width="290" height="95" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    
    <g transform="translate(70, 350)" font-family="'League Spartan', sans-serif" font-size="11.5" font-weight="500" fill="#F1F5F9">
      <circle cx="4" cy="-4" r="3" fill="#38BDF8" />
      <text x="16" y="0">Location Longue Durée (LLD) &amp; Flotte</text>

      <circle cx="4" cy="18" r="3" fill="#38BDF8" />
      <text x="16" y="22">Chauffeurs formés &amp; Gestion du risque</text>

      <circle cx="4" cy="40" r="3" fill="#38BDF8" />
      <text x="16" y="44">Optimisation du Coût Total de Mobilité (TCM)</text>
    </g>

    <!-- Footer of Cover -->
    <line x1="55" y1="445" x2="345" y2="445" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="55" y="475" font-family="'Glacial Indifference', sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="1">TOGO &amp; AFRIQUE DE L'OUEST</text>
    <text x="345" y="475" text-anchor="end" font-family="'League Spartan', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DOCUMENT PDF</text>

    <!-- Spine highlight / page fold on left -->
    <rect x="25" y="20" width="18" height="495" rx="14" fill="url(#spineGloss)" />
    <!-- Thin spine ridge line -->
    <line x1="43" y1="20" x2="43" y2="515" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
  </g>
</svg>
